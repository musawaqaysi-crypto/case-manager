<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الحالات المتأخرة</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: summary tiles on top, filterable patient list, a side panel with the case manager's fixed-choice form */
:root{
  --bg:#f3f7fb; --surface:#ffffff; --raise:#edf3f9; --ink:#0f2238; --muted:#5b6f86; --line:#dbe5ef;
  --accent:#1769c4; --accent-soft:#e2eefb; --ok:#13865b; --ok-soft:#e1f5ec; --warn:#b26a00; --warn-soft:#fff3dc;
  --bad:#c2412d; --bad-soft:#fdece8;
  --f-body:"IBM Plex Sans Arabic",-apple-system,"SF Arabic",Tahoma,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.mark svg.i{width:24px;height:24px}
.ttl{flex:1;min-width:200px}
.ttl h1{margin:0;font-size:1.15rem}
.ttl p{margin:0;font-size:.8rem;color:var(--muted)}
.btn{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.privacy{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--ok);background:var(--ok-soft);border-radius:10px;padding:8px 12px;margin-top:14px}
main{padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}

.drop{border:2px dashed var(--line);border-radius:16px;background:var(--surface);padding:40px 20px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop b{color:var(--ink);font-size:1.05rem}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg.i{width:36px;height:36px;color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .n{font:600 1.9rem/1.1 var(--f-data)}
.tile .l{font-size:.8rem;color:var(--muted)}
.tile.warn .n{color:var(--warn)} .tile.bad .n{color:var(--bad)} .tile.ok .n{color:var(--ok)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h2{margin:0 0 10px;font-size:1rem}
.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(120px,220px) 1fr 40px;gap:10px;align-items:center;font-size:.85rem}
.barrow .track{height:12px;border-radius:6px;background:var(--raise);overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.barrow .v{font-family:var(--f-data);text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
.filters input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--raise);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
td.num{font-family:var(--f-data)}
.los{display:inline-block;min-width:44px;text-align:center;font:600 .8rem var(--f-data);border-radius:999px;padding:2px 8px;background:var(--raise)}
.los.w{background:var(--warn-soft);color:var(--warn)} .los.b{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-block;font-size:.72rem;border-radius:999px;padding:2px 9px;background:var(--raise);color:var(--muted);margin-inline-end:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.r{background:var(--bad-soft);color:var(--bad)} .pill.a{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:24px}

aside.form{position:fixed;inset-block:0;inset-inline-start:0;width:min(460px,100%);background:var(--surface);border-inline-end:1px solid var(--line);box-shadow:0 0 40px rgba(15,34,56,.18);
  display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fh{display:flex;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.fh .who{flex:1;min-width:0}
.fh b{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.fh span{font-size:.8rem;color:var(--muted)}
.x{border:0;background:var(--raise);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.fb{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.fg h3{margin:0 0 8px;font-size:.9rem;display:flex;align-items:center;gap:8px}
.fg h3 small{font-weight:400;color:var(--muted);font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 .82rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.r[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.fg input[type=date],.fg input[type=text],.fg textarea,.fg select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fg textarea{min-height:70px;resize:vertical}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font:600 .85rem var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.disc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:12px}
.ff{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--ok)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:.88rem;z-index:30}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bed" viewBox="0 0 24 24"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15v2M12 10v7M17 6v11"/></symbol>
</svg>

<header>
  <div class="wrap">
    <div class="mark"><svg class="i"><use href="#i-bed"/></svg></div>
    <div class="ttl"><h1>متابعة الحالات المتأخرة</h1><p>أداة مدير الحالة للمرضى المنوّمين</p></div>
    <label class="btn primary" for="file"><svg class="i"><use href="#i-up"/></svg>فتح ملف التنويم</label>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    <button class="btn" id="export" hidden><svg class="i"><use href="#i-down"/></svg>تصدير Excel كامل</button>
    <button class="btn" id="report" hidden><svg class="i"><use href="#i-chart"/></svg>تقرير للإدارة (أرقام فقط)</button>
  </div>
</header>

<main class="wrap">
  <div class="privacy"><svg class="i"><use href="#i-lock"/></svg>الملف يُقرأ داخل هذا المتصفح فقط ولا يُرفع لأي مكان. إدخالات مدير الحالة تُحفظ على هذا الجهاز.</div>

  <label class="drop" id="drop" for="file">
    <svg class="i"><use href="#i-up"/></svg>
    <b>افتح ملف قائمة المنوّمين من النظام</b>
    <span>Excel أو CSV · أو اسحبه هنا</span>
    <button class="btn" id="demo" type="button" style="margin-top:8px">تجربة ببيانات وهمية</button>
  </label>

  <section id="app" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="tiles" id="tiles"></div>
    <div class="two">
      <div class="panel"><h2>أسباب التأخير</h2><div class="bars" id="b-reason"></div></div>
      <div class="panel"><h2>المرضى حسب القسم المنوِّم</h2><div class="bars" id="b-clinic"></div></div>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="بحث بالاسم أو رقم الملف أو الطبيب">
      <select id="f-ward"><option value="">كل الأجنحة</option></select>
      <select id="f-clinic"><option value="">كل الأقسام</option></select>
      <select id="f-los"><option value="">كل المدد</option><option value="7">أكثر من 7 أيام</option><option value="21">أكثر من 21 يوماً</option></select>
      <select id="f-status"><option value="">كل الحالات</option><option value="none">بدون إدخال</option><option value="adm">منوّم</option><option value="dc">خرج</option><option value="gone">غير موجود في آخر ملف</option></select>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>الاسم</th><th>رقم الملف</th><th>الجناح</th><th>السرير</th><th>القسم</th><th>الطبيب</th><th>المدة</th><th>الخروج المتوقع</th><th>المتابعة</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<aside class="form" id="form" hidden>
  <div class="fh"><div class="who"><b id="p-name"></b><span id="p-meta"></span></div><button class="x" id="close" aria-label="إغلاق"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="fb" id="fb"></div>
  <div class="ff" id="saved"><svg class="i"><use href="#i-check"/></svg>يُحفظ تلقائياً</div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Fixed choices follow the case manager improvement plan: delay reasons, escalation ladder, pending work.
const PENDING = ["تحاليل مختبر", "نتيجة مزرعة", "أشعة مقطعية CT", "رنين مغناطيسي MRI", "ألتراساوند", "إيكو القلب", "منظار", "عينة نسيجية", "استشارة تخصص آخر", "إجراء أو عملية", "لا يوجد"];
const REASONS = ["انتظار إحالة (إحالتي)", "انتظار استشارة تخصص آخر", "انتظار فحص أو إجراء", "انتظار قرار طبي", "سبب اجتماعي / لا يوجد مستلم", "رعاية منزلية أو أجهزة", "نقل أو أدوية الخروج", "رفض الخروج من المريض أو الأهل", "لا يوجد تأخير"];
const ESC = ["لا يحتاج", "رئيس القسم", "نائب المدير الطبي", "إدارة المستشفى والتجمع"];
const DC_TYPES = ["خروج للمنزل", "تحويل لمستشفى آخر", "خروج على مسؤوليته", "رعاية منزلية", "وفاة"];
const OTHER = "أسباب أخرى";

const COLS = {
  mrn: ["mrn", "رقم الملف", "file", "medical record"], name: ["patient_name", "name", "الاسم", "اسم المريض"],
  ward: ["ward", "الجناح"], bed: ["bed_code", "bed", "السرير"], doctor: ["doctor_name", "doctor", "الطبيب"],
  clinic: ["admited_clinic", "admitted_clinic", "clinic", "القسم", "العيادة"], days: ["no_of_days", "days", "los", "المدة", "عدد الأيام"],
};
const LS = "cm-entries-v1", LSL = "cm-last-list-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").trim().toLowerCase().replace(/[\s_\-]+/g, "_");
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const today = () => new Date().toISOString().slice(0, 10);

let patients = [], entries = store.get(LS, {}), current = null, prevList = store.get(LSL, []);

function parse(rows){
  const hi = rows.findIndex(r => r.some(c => Object.values(COLS).flat().map(norm).includes(norm(c))));
  if (hi < 0) throw new Error("ما لقيت أعمدة القائمة (MRN، الاسم، المدة…)");
  const col = {};
  rows[hi].forEach((c, i) => { for (const [k, al] of Object.entries(COLS)) if (al.map(norm).includes(norm(c)) && !(k in col)) col[k] = i; });
  if (!("mrn" in col)) throw new Error("لازم يكون فيه عمود رقم الملف (MRN)");
  return rows.slice(hi + 1).filter(r => r[col.mrn] !== undefined && String(r[col.mrn]).trim()).map(r => ({
    mrn: String(r[col.mrn]).trim(), name: String(r[col.name] ?? "").trim(), ward: String(r[col.ward] ?? "").trim(),
    bed: String(r[col.bed] ?? "").trim(), doctor: String(r[col.doctor] ?? "").trim(), clinic: String(r[col.clinic] ?? "").trim(),
    days: Number(r[col.days]) || 0,
  }));
}

function load(list){
  // patients in the previous list but missing now probably left the hospital
  const now = new Set(list.map(p => p.mrn));
  const gone = prevList.filter(p => !now.has(p.mrn)).map(p => ({...p, gone: true}));
  patients = [...list, ...gone];
  store.set(LSL, list.map(({mrn, name, ward, bed, doctor, clinic, days}) => ({mrn, name, ward, bed, doctor, clinic, days})));
  prevList = list;
  // entries saved in a previously exported file come back with it
  $("drop").hidden = true; $("app").hidden = false; $("export").hidden = false; $("report").hidden = false;
  fillFilters(); render();
}

function readFile(f){
  f.arrayBuffer().then(buf => {
    const wb = XLSX.read(buf, {type: "array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: true, defval: ""});
    const list = parse(rows);
    const cmSheet = wb.Sheets["متابعة مدير الحالة"];
    if (cmSheet) XLSX.utils.sheet_to_json(cmSheet, {defval: ""}).forEach(r => {
      if (!r["رقم الملف"]) return;
      const e = entries[String(r["رقم الملف"])] ||= {};
      try { Object.assign(e, JSON.parse(r["__data"] || "{}")); } catch {}
    });
    store.set(LS, entries);
    load(list);
    toast(`تم فتح ${list.length} مريض`);
  }).catch(e => toast(e.message || "ما قدرت أقرأ الملف"));
}

const entry = mrn => entries[mrn] || {};
function save(){ store.set(LS, entries); }

function fillFilters(){
  const opts = (k, el) => { const v = [...new Set(patients.map(p => p[k]).filter(Boolean))].sort(); $(el).innerHTML = $(el).options[0].outerHTML + v.map(x => `<option>${esc(x)}</option>`).join(""); };
  opts("ward", "f-ward"); opts("clinic", "f-clinic");
}

function statusOf(p){
  const e = entry(p.mrn);
  if (e.status === "dc") return "dc";
  if (p.gone) return "gone";
  if (e.status === "adm" || (e.reasons || []).length || e.edd) return "adm";
  return "none";
}

function bars(el, counts){
  const items = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...items.map(i => i[1]));
  $(el).innerHTML = items.length ? items.map(([k, v]) => `<div class="barrow"><span>${esc(k)}</span><span class="track"><i style="width:${v / max * 100}%"></i></span><span class="v">${v}</span></div>`).join("") : `<p class="empty">ما فيه إدخالات بعد</p>`;
}

function render(){
  const inHosp = patients.filter(p => !p.gone && entry(p.mrn).status !== "dc");
  const d = inHosp.map(p => p.days);
  const done = inHosp.filter(p => (entry(p.mrn).reasons || []).length).length;
  const late = inHosp.filter(p => { const e = entry(p.mrn); return e.edd && e.edd < today(); }).length;
  $("tiles").innerHTML = [
    ["", inHosp.length, "منوّم حالياً"], ["warn", d.filter(x => x > 7).length, "أكثر من 7 أيام"], ["bad", d.filter(x => x > 21).length, "أكثر من 21 يوماً"],
    ["", d.length ? (d.reduce((a, b) => a + b, 0) / d.length).toFixed(1) : "0", "متوسط مدة الإقامة (يوم)"],
    ["ok", `${done}/${inHosp.length}`, "مسجّل سبب تأخيرهم"], ["bad", late, "تجاوزوا تاريخ الخروج المتوقع"],
  ].map(([c, n, l]) => `<div class="tile ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  const rc = {}; inHosp.forEach(p => { const e = entry(p.mrn); (e.reasons || []).forEach(r => rc[r === OTHER && e.reasonOther ? `${OTHER}: ${e.reasonOther}` : r] = (rc[r === OTHER && e.reasonOther ? `${OTHER}: ${e.reasonOther}` : r] || 0) + 1); });
  bars("b-reason", rc);
  const cc = {}; inHosp.forEach(p => cc[p.clinic || "غير محدد"] = (cc[p.clinic || "غير محدد"] || 0) + 1); bars("b-clinic", cc);

  const q = $("q").value.trim().toLowerCase(), fw = $("f-ward").value, fc = $("f-clinic").value, fl = +$("f-los").value || 0, fs = $("f-status").value;
  const list = patients.filter(p => (!q || `${p.name} ${p.mrn} ${p.doctor}`.toLowerCase().includes(q)) && (!fw || p.ward === fw) && (!fc || p.clinic === fc) && p.days > fl && (!fs || statusOf(p) === fs))
    .sort((a, b) => (a.gone - b.gone) || b.days - a.days);
  $("rows").innerHTML = list.length ? list.map(p => {
    const e = entry(p.mrn), st = statusOf(p);
    const pill = {none: `<span class="pill r">بدون إدخال</span>`, adm: `<span class="pill a">${esc((e.reasons || [])[0] || "منوّم")}</span>`, dc: `<span class="pill ok">خرج ${esc(e.dcDate || "")}</span>`, gone: `<span class="pill">غير موجود في آخر ملف</span>`}[st];
    const overdue = e.edd && e.edd < today() && st === "adm";
    return `<tr data-mrn="${esc(p.mrn)}" class="${current === p.mrn ? "sel" : ""}"><td>${esc(p.name)}</td><td class="num">${esc(p.mrn)}</td><td>${esc(p.ward)}</td><td class="num">${esc(p.bed)}</td><td>${esc(p.clinic)}</td><td>${esc(p.doctor)}</td>
      <td><span class="los ${p.days > 21 ? "b" : p.days > 7 ? "w" : ""}">${p.days}</span></td><td class="num" style="${overdue ? "color:var(--bad);font-weight:600" : ""}">${esc(e.edd || "—")}</td><td>${pill}</td></tr>`;
  }).join("") : `<tr><td colspan="9" class="empty">ما فيه نتائج</td></tr>`;
}

// ---------- the case manager's form ----------
function chipGroup(key, options, multi, red){
  const e = entry(current), val = e[key] ?? (multi ? [] : "");
  return `<div class="chips" data-key="${key}" data-multi="${multi ? 1 : 0}">${options.map(o => `<button type="button" class="chip${red ? " r" : ""}" aria-pressed="${multi ? val.includes(o) : val === o}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
}
function openForm(mrn){
  current = mrn; const p = patients.find(x => x.mrn === mrn), e = entries[mrn] ||= {};
  $("p-name").textContent = p.name || "—";
  $("p-meta").textContent = `ملف ${p.mrn} · ${p.ward} ${p.bed} · ${p.clinic} · ${p.days} يوم`;
  const dc = e.status === "dc";
  $("fb").innerHTML = `
    <div class="fg"><h3>الحالة</h3><div class="seg" data-key="status"><button type="button" data-v="adm" aria-pressed="${!dc}">منوّم</button><button type="button" data-v="dc" aria-pressed="${dc}">خرج</button></div></div>
    <div class="fg"><h3>التاريخ المتوقع للخروج</h3><input type="date" id="edd" value="${esc(e.edd || "")}"></div>
    <div class="fg"><h3>المتبقي قبل الخروج <small>اختر كل اللي ينطبق</small></h3>${chipGroup("pending", PENDING, true)}</div>
    <div class="fg"><h3>سبب التأخير <small>اختر كل اللي ينطبق</small></h3>${chipGroup("reasons", [...REASONS, OTHER], true, true)}
      <input type="text" id="reasonOther" placeholder="اذكر السبب الآخر" value="${esc(e.reasonOther || "")}" style="margin-top:8px" ${(e.reasons || []).includes(OTHER) ? "" : "hidden"}></div>
    <div class="fg"><h3>التصعيد</h3>${chipGroup("escalation", ESC, false)}</div>
    <div class="disc" id="dc" ${dc ? "" : "hidden"}>
      <div class="fg"><h3>تاريخ الخروج</h3><input type="date" id="dcDate" value="${esc(e.dcDate || today())}"></div>
      <div class="fg"><h3>نوع الخروج</h3>${chipGroup("dcType", DC_TYPES, false)}</div>
      <div class="fg"><h3>أسباب التأخر في الخروج <small>اختر كل اللي ينطبق</small></h3>${chipGroup("dcReasons", [...REASONS, OTHER], true, true)}
        <input type="text" id="dcOther" placeholder="اذكر السبب الآخر" value="${esc(e.dcOther || "")}" style="margin-top:8px" ${(e.dcReasons || []).includes(OTHER) ? "" : "hidden"}></div>
    </div>
    <div class="fg"><h3>ملاحظات</h3><textarea id="note" placeholder="ملاحظات مدير الحالة">${esc(e.note || "")}</textarea></div>`;
  $("form").hidden = false; render();
}
function touch(){ entries[current].updated = new Date().toISOString(); save(); render(); flash(); }
function flash(){ const s = $("saved"); s.style.opacity = .4; setTimeout(() => s.style.opacity = 1, 200); }

$("fb").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const box = b.parentElement, key = box.dataset.key, e = entries[current];
  if (!key) return;
  if (box.classList.contains("seg")) {
    e.status = b.dataset.v; box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("dc").hidden = e.status !== "dc"; if (e.status === "dc" && !e.dcDate) e.dcDate = $("dcDate").value; return touch();
  }
  const v = b.dataset.v;
  if (box.dataset.multi === "1") {
    let arr = e[key] || [];
    arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
    if (v === "لا يوجد" || v === "لا يوجد تأخير") arr = arr.includes(v) ? [v] : arr;
    else arr = arr.filter(x => x !== "لا يوجد" && x !== "لا يوجد تأخير");
    e[key] = arr;
    box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", arr.includes(x.dataset.v)));
    if (key === "reasons") $("reasonOther").hidden = !arr.includes(OTHER);
    if (key === "dcReasons") $("dcOther").hidden = !arr.includes(OTHER);
  } else {
    e[key] = e[key] === v ? "" : v;
    box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === e[key]));
  }
  touch();
});
$("fb").addEventListener("input", ev => {
  const id = ev.target.id; if (!["edd", "reasonOther", "dcDate", "dcOther", "note"].includes(id)) return;
  entries[current][id] = ev.target.value; touch();
});
$("close").onclick = () => { $("form").hidden = true; current = null; render(); };
$("rows").addEventListener("click", ev => { const tr = ev.target.closest("tr[data-mrn]"); if (tr) openForm(tr.dataset.mrn); });
["q", "f-ward", "f-clinic", "f-los", "f-status"].forEach(id => $(id).addEventListener("input", render));

// ---------- files ----------
$("file").onchange = e => e.target.files[0] && readFile(e.target.files[0]);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]); };

const J = a => (a || []).join("، ");
$("export").onclick = () => {
  const rows = patients.map(p => { const e = entry(p.mrn); return {
    "رقم الملف": p.mrn, "الاسم": p.name, "الجناح": p.ward, "السرير": p.bed, "القسم": p.clinic, "الطبيب": p.doctor, "المدة (يوم)": p.days,
    "الحالة": e.status === "dc" ? "خرج" : p.gone ? "غير موجود في آخر ملف" : "منوّم", "الخروج المتوقع": e.edd || "",
    "المتبقي": J(e.pending), "سبب التأخير": J(e.reasons) + (e.reasonOther ? ` (${e.reasonOther})` : ""), "التصعيد": e.escalation || "",
    "تاريخ الخروج": e.dcDate || "", "نوع الخروج": e.dcType || "", "أسباب التأخر في الخروج": J(e.dcReasons) + (e.dcOther ? ` (${e.dcOther})` : ""),
    "ملاحظات": e.note || "", "__data": JSON.stringify(e) }; });
  const wb = XLSX.utils.book_new(); wb.Workbook = {Views: [{RTL: true}]};
  const src = XLSX.utils.aoa_to_sheet([["MRN", "PATIENT_NAME", "BED_CODE", "WARD", "DOCTOR_NAME", "ADMITED_CLINIC", "NO_OF_DAYS"], ...patients.filter(p => !p.gone).map(p => [p.mrn, p.name, p.bed, p.ward, p.doctor, p.clinic, p.days])]);
  XLSX.utils.book_append_sheet(wb, src, "القائمة");
  const ws = XLSX.utils.json_to_sheet(rows); ws["!cols"] = [10, 26, 14, 10, 22, 20, 8, 12, 12, 26, 32, 18, 12, 16, 32, 30, 4].map(w => ({wch: w}));
  XLSX.utils.book_append_sheet(wb, ws, "متابعة مدير الحالة");
  XLSX.writeFile(wb, `متابعة-الحالات-${today()}.xlsx`);
  toast("تم التصدير. احفظه في مكان آمن لأنه فيه بيانات مرضى");
};
$("report").onclick = () => {
  const inHosp = patients.filter(p => !p.gone && entry(p.mrn).status !== "dc"), d = inHosp.map(p => p.days);
  const count = (arr, f) => { const c = {}; arr.forEach(p => f(p).forEach(k => c[k] = (c[k] || 0) + 1)); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
  const wb = XLSX.utils.book_new(); wb.Workbook = {Views: [{RTL: true}]};
  const sum = [["المؤشر", "القيمة"], ["التاريخ", today()], ["منوّم حالياً", inHosp.length], ["أكثر من 7 أيام", d.filter(x => x > 7).length], ["أكثر من 21 يوماً", d.filter(x => x > 21).length],
    ["متوسط مدة الإقامة", d.length ? +(d.reduce((a, b) => a + b, 0) / d.length).toFixed(1) : 0], ["مسجّل سبب تأخيرهم", inHosp.filter(p => (entry(p.mrn).reasons || []).length).length],
    ["تجاوزوا التاريخ المتوقع", inHosp.filter(p => { const e = entry(p.mrn); return e.edd && e.edd < today(); }).length]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), "الملخص");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["سبب التأخير", "عدد المرضى"], ...count(inHosp, p => entry(p.mrn).reasons || [])]), "أسباب التأخير");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["المتبقي", "عدد المرضى"], ...count(inHosp, p => entry(p.mrn).pending || [])]), "المتبقي");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["القسم", "عدد المرضى", "أكثر من 7 أيام"], ...Object.entries(inHosp.reduce((c, p) => { const k = p.clinic || "غير محدد"; c[k] ||= [0, 0]; c[k][0]++; if (p.days > 7) c[k][1]++; return c; }, {})).map(([k, [a, b]]) => [k, a, b])]), "حسب القسم");
  const dc = patients.filter(p => entry(p.mrn).status === "dc");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["أسباب التأخر في الخروج", "عدد"], ...count(dc, p => entry(p.mrn).dcReasons || [])]), "أسباب تأخر الخروج");
  XLSX.writeFile(wb, `تقرير-الحالات-المتأخرة-${today()}.xlsx`);
  toast("التقرير فيه أرقام فقط، بدون أسماء");
};

$("demo").onclick = ev => {
  ev.preventDefault(); ev.stopPropagation();
  const W = ["MALE WARD", "FEMALE WARD", "ICU"], C = ["Internal Medicine Specialty", "General Surgery", "GENERAL OB/GYN", "Orthopedic", "Pediatric"];
  load(Array.from({length: 18}, (_, i) => ({mrn: String(900100 + i), name: `مريض تجريبي ${i + 1}`, ward: W[i % 3], bed: `B-${10 + i}`, doctor: `د. تجريبي ${i % 5 + 1}`, clinic: C[i % 5], days: [3, 5, 9, 12, 15, 24, 31, 8, 4, 19, 26, 45, 6, 11, 2, 22, 14, 7][i]})));
  toast("بيانات وهمية للتجربة");
};

function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 3200); }

if (prevList.length) load(prevList);
</script>
</body>
